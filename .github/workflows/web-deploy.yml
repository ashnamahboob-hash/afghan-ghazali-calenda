name: Build and deploy Afghan Ghazali Calendar Web

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate web platform files if missing
        run: |
          if [ ! -f web/index.html ]; then
            flutter create --platforms=web --project-name afghan_ghazali_calendar .
          fi
      - name: Remove generated placeholder test
        run: |
          # flutter create generates a generic test when the repository has no widget_test.dart.
          # That scaffold targets MyApp/material_ui, while this app uses AfghanGhazaliApp.
          if [ -f test/widget_test.dart ] && grep -q "package:material_ui/material_ui.dart" test/widget_test.dart; then
            rm test/widget_test.dart
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build web release
        run: flutter build web --release --base-href /afghan-ghazali-calenda/
      - name: Upload web artifact for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: afghan-ghazali-calendar-web
          path: build/web
          if-no-files-found: error
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
