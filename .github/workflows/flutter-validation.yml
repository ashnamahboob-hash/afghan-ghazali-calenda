name: Flutter validation

on:
  push:
    paths:
      - "lib/**"
      - "assets/data/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-validation.yml"
  pull_request:
    paths:
      - "lib/**"
      - "assets/data/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
