
name: Build Afghan Ghazali Calendar APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix package name
        run: |
          sed -i 's/^name:.*/name: afghan_ghazali_calendar/' pubspec.yaml

      - name: Generate Android files
        run: flutter create --project-name=afghan_ghazali_calendar --platforms=android .

      - name: Install packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Ghazali-Calendar-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
