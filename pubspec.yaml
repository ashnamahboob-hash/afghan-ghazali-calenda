name: afghan_ghazali_calendar
description: Afghan Ghazali Calendar - offline Afghan solar calendar and prayer times.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/kandahar_districts.json
    - assets/data/afghanistan_admin_divisions_reference_draft.json
    - assets/data/agricultural_advisory.json
